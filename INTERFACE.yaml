# L4 Kernel Interface Registry

project: l4-kernel
layer: L4
description: L4 知识主权只读契约编译与 Harness；旧 KEMS 管理面仅作兼容视图

cli:
  - name: l4-kernel
    module: l4_kernel.cli:main
    description: L4 契约 CLI (contract/registry/harness；domain/skill/workflow 为 legacy)
    commands:
      - l4-kernel contract validate PATH --json
      - l4-kernel registry list --registry PATH --json
      - l4-kernel harness run DOMAIN_ID --gates T0,T1,T2,T4,T7 --json

mcp:
  - port: 7456
    name: l4-kernel-mcp-sse
    module: l4_kernel.mcp_server:run_sse
    protocol: SSE (stdio fallback)
    description: L4 自我层 MCP SSE 端点(给上层 Agent 跨域信号总线访问)
    owner: l4-kernel
    enforcement: env-only   # 默认 7456 但生产用 L4_KERNEL_MCP_PORT env 覆盖
    readonly_phase0_tools:
      - l4_contract_validate
      - l4_harness_run

http: []

dependencies:
  runtime: [pyyaml]
  dev: [pytest, ruff]

environment:
  required:
    L4_DOMAIN_REGISTRY: DomainRegistry YAML 的显式路径
  legacy:
    L4_REGISTRY_MODE: 仅值 legacy 启用内置注册表回滚视图
    L4_LEGACY_DIRECT_WRITE: 仅值 "1" 启用受 containment 约束的旧直接写

exit_codes:
  0: valid
  1: validation_failure
  2: configuration_failure

phase0_exclusions:
  - ContextPack（Phase 1）

tests: dynamic  # 以 CI 收集结果为准，禁止手工维护固定数量
